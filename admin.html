<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SevenzGod's Spar — Admin</title><style>
:root{--bg:#080b12;--card:#111725;--line:#273247;--text:#f5f7fb;--muted:#9ba8bc;--a:#ffb000;--a2:#ff6b00;--g:#38d996;--r:#ff5d6c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#26324b,#0d121d 38%,var(--bg) 70%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:780px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--a)}.status{font-size:11px;color:var(--g);border:1px solid #285f4e;padding:5px 9px;border-radius:99px}.card{background:linear-gradient(145deg,#151d2c,#0f1521);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#0b111b;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:24px;display:block}.muted{color:var(--muted);font-size:12px}h1{margin:8px 0}h2,h3{margin:0 0 12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.team{text-align:center;background:#0b111b;border:1px solid var(--line);border-radius:12px;padding:12px}.team b{display:block}.vs{font-weight:900;color:var(--a)}label{font-size:11px;color:var(--muted);display:block;margin:9px 0 5px}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#090e17;color:var(--text)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:11px;border:0;border-radius:10px;font-weight:900;background:linear-gradient(90deg,var(--a),var(--a2));color:#111}.btn.sec{background:#1b2536;color:var(--text);border:1px solid var(--line)}.btn.win{background:#123a2c;color:#72efb8;border:1px solid #286c51}.btn.danger{background:#35151b;color:#ff9ca5;border:1px solid #67303a}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#202b40;color:#b9c6da;font-size:10px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:25px}.final{border-color:var(--a)}.waitingRow{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.login{max-width:430px;margin:80px auto}.error{color:#ff8994;font-size:12px;margin-top:8px}@media(max-width:560px){.controls,.teams{grid-template-columns:1fr}.vs{display:none}}
</style></head><body><div id="app"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getFirestore,collection,query,where,onSnapshot,writeBatch,doc,updateDoc,deleteDoc,addDoc,serverTimestamp,getDocs} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);let teams=[],matches=[],filter='all';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function login(){document.querySelector('#app').innerHTML=`<div class="card login"><h1>🛡️ Admin Login</h1><p class="muted">Masuk menggunakan akun Firebase Authentication admin.</p><label>Email</label><input id="email" type="email" placeholder="admin@email.com"><label>Password</label><input id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn">Masuk</button><div id="err" class="error"></div></div>`;$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('err').textContent='Login gagal: '+e.message}}}
function team(t){return `<div class="team"><b>${esc(t.teamName)}</b><span class="muted">${esc(t.className)} • ${t.mode}vs${t.mode}</span></div>`}
function render(){let arr=matches.slice().reverse().filter(m=>filter==='all'||(filter==='final'?m.final:filter==='done'?m.status==='done':filter==='scheduled'?(m.status||'scheduled')==='scheduled':m.status==='ongoing'));$('waiting').textContent=teams.length;$('total').textContent=matches.length;$('done').textContent=matches.filter(m=>m.status==='done').length;$('finals').textContent=matches.filter(m=>m.final).length;$('matches').innerHTML=arr.length?arr.map(card).join(''):'<div class="card empty">Tidak ada pertandingan.</div>';$('waitingList').innerHTML=teams.length?teams.map(t=>`<div class="waitingRow"><div><b>${esc(t.teamName)}</b><br><span class="muted">${esc(t.className)} • ${t.mode}vs${t.mode}</span></div><button class="btn danger" style="width:auto" onclick="deleteTeam('${t.id}')">Hapus</button></div>`).join(''):'<div class="empty">Tidak ada tim menunggu.</div>'}
function card(m){let a=m.a,b=m.b;return `<div class="card ${m.final?'final':''}"><div style="display:flex;justify-content:space-between"><span class="badge">${m.final?'🏆 FINAL':m.status==='done'?'✅ SELESAI':m.status==='ongoing'?'🔴 BERLANGSUNG':'🕒 TERJADWAL'}</span><span class="muted">${m.mode}VS${m.mode}</span></div><div class="teams">${team(a)}<div class="vs">VS</div>${team(b)}</div><div class="controls"><div><label>Jadwal</label><input type="datetime-local" value="${m.schedule||''}" onchange="window.setSchedule('${m.id}',this.value)"></div><div><label>Status</label><select onchange="window.setStatus('${m.id}',this.value)"><option value="scheduled" ${(m.status||'scheduled')==='scheduled'?'selected':''}>Terjadwal</option><option value="ongoing" ${m.status==='ongoing'?'selected':''}>Berlangsung</option><option value="done" ${m.status==='done'?'selected':''}>Selesai</option></select></div></div><div class="controls"><div><label>Skor ${esc(a.teamName)}</label><input type="number" min="0" value="${m.scoreA??0}" onchange="window.setScore('${m.id}','A',this.value)"></div><div><label>Skor ${esc(b.teamName)}</label><input type="number" min="0" value="${m.scoreB??0}" onchange="window.setScore('${m.id}','B',this.value)"></div></div><div class="controls"><button class="btn win" onclick="window.winner('${m.id}','A')">🏆 ${esc(a.teamName)} Menang</button><button class="btn win" onclick="window.winner('${m.id}','B')">🏆 ${esc(b.teamName)} Menang</button></div><div class="controls"><button class="btn sec" onclick="window.toggleFinal('${m.id}')">${m.final?'↩️ Batal Final':'🏆 Jadikan Final'}</button><button class="btn danger" onclick="window.removeMatch('${m.id}')">Hapus Match</button></div>${m.winner?`<p style="text-align:center;color:var(--g);font-weight:900">🏆 PEMENANG: ${esc(m.winner.teamName)}</p>`:''}</div>`}
function find(id){return matches.find(m=>m.id===id)}
window.setSchedule=async(id,v)=>{await updateDoc(doc(db,'matches',id),{schedule:v})};window.setStatus=async(id,v)=>{await updateDoc(doc(db,'matches',id),{status:v})};window.setScore=async(id,w,v)=>{await updateDoc(doc(db,'matches',id),{[w==='A'?'scoreA':'scoreB']:Math.max(0,Number(v)||0)})};window.winner=async(id,w)=>{let m=find(id);if(m)await updateDoc(doc(db,'matches',id),{winner:w==='A'?m.a:m.b,status:'done'})};window.toggleFinal=async id=>{let m=find(id);if(m)await updateDoc(doc(db,'matches',id),{final:!m.final})};window.removeMatch=async id=>{if(confirm('Hapus pertandingan ini?'))await deleteDoc(doc(db,'matches',id))};window.deleteTeam=async id=>{if(confirm('Hapus tim menunggu ini?'))await deleteDoc(doc(db,'teams',id))};
async function autoMatch(){let by={};teams.forEach(t=>(by[t.mode]??=[]).push(t));const batch=writeBatch(db);let made=0;for(const mode of Object.keys(by)){let arr=by[mode];for(let i=0;i+1<arr.length;i+=2){let a=arr[i],b=arr[i+1],ref=doc(collection(db,'matches'));batch.set(ref,{mode:Number(mode),a:{id:a.id,mode:a.mode,className:a.className,teamName:a.teamName,members:a.members},b:{id:b.id,mode:b.mode,className:b.className,teamName:b.teamName,members:b.members},status:'scheduled',scoreA:0,scoreB:0,final:false,createdAt:serverTimestamp()});batch.update(doc(db,'teams',a.id),{status:'matched'});batch.update(doc(db,'teams',b.id),{status:'matched'});made++}}if(made){await batch.commit();alert(made+' match berhasil dibuat.')}else alert('Belum ada 2 tim dengan mode yang sama.')}
async function resetAll(){if(!confirm('Hapus SEMUA pertandingan dan tim?'))return;const batch=writeBatch(db);matches.forEach(m=>batch.delete(doc(db,'matches',m.id)));teams.forEach(t=>batch.delete(doc(db,'teams',t.id)));await batch.commit()}
function dashboard(){document.querySelector('#app').innerHTML=`<div class="wrap"><header class="top"><div class="brand">🛡️ SevenzGod's <span>SPAR ADMIN</span></div><button class="btn sec" style="width:auto" id="logout">Keluar</button></header><h1>Panel Pertandingan</h1><p class="muted">Firebase aktif. Perubahan admin akan terlihat realtime di halaman peserta.</p><div class="grid"><div class="stat"><span class="muted">Menunggu</span><b id="waiting">0</b></div><div class="stat"><span class="muted">Pertandingan</span><b id="total">0</b></div><div class="stat"><span class="muted">Selesai</span><b id="done">0</b></div><div class="stat"><span class="muted">Final</span><b id="finals">0</b></div></div><div class="card"><h2>🎲 Buat pertandingan</h2><p class="muted">Pasangkan otomatis hanya untuk tim dengan mode yang sama.</p><button class="btn" id="auto">⚔️ Auto Match</button></div><div class="card"><h2>⏳ Tim menunggu</h2><div id="waitingList"></div></div><div class="card"><h2>⚙️ Filter pertandingan</h2><select id="filter"><option value="all">Semua</option><option value="scheduled">Terjadwal</option><option value="ongoing">Berlangsung</option><option value="done">Selesai</option><option value="final">Final</option></select></div><div id="matches"></div><div class="card"><button class="btn danger" id="reset">Reset Semua Data</button></div></div>`;$('logout').onclick=()=>signOut(auth);$('auto').onclick=autoMatch;$('reset').onclick=resetAll;$('filter').onchange=e=>{filter=e.target.value;render()};render()}
function start(){dashboard();onSnapshot(query(collection(db,'teams'),where('status','==','waiting')),s=>{teams=s.docs.map(d=>({id:d.id,...d.data()}));render()});onSnapshot(collection(db,'matches'),s=>{matches=s.docs.map(d=>({id:d.id,...d.data()}));render()})}
onAuthStateChanged(auth,user=>{if(user)start();else login()});
</script></body></html>
